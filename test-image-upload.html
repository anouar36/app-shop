<!DOCTYPE html>
<html>
<head>
    <title>Test Image Upload</title>
</head>
<body>
    <h1>Test Product with Image Upload</h1>
    <form id="productForm">
        <div>
            <label>Name:</label>
            <input type="text" id="name" value="Test Product with Image" required>
        </div>
        <div>
            <label>Category ID:</label>
            <input type="number" id="category_id" value="1" required>
        </div>
        <div>
            <label>Price:</label>
            <input type="number" id="price" value="29.99" step="0.01" required>
        </div>
        <div>
            <label>Sale Price:</label>
            <input type="number" id="current_price" value="24.99" step="0.01" required>
        </div>
        <div>
            <label>Description:</label>
            <textarea id="description" required>Test product with image upload functionality</textarea>
        </div>
        <div>
            <label>Size:</label>
            <input type="text" id="size" value="M">
        </div>
        <div>
            <label>Image:</label>
            <input type="file" id="image" accept="image/*">
        </div>
        <button type="submit">Add Product</button>
    </form>

    <script>
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('category_id', document.getElementById('category_id').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('current_price', document.getElementById('current_price').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('size', document.getElementById('size').value);
            
            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/products', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.json();
                    alert('Product added successfully! ID: ' + result.id);
                    console.log('Product:', result);
                } else {
                    const error = await response.json();
                    alert('Error: ' + JSON.stringify(error));
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            }
        });
    </script>
</body>
</html>
