<!DOCTYPE html>
<html>
<head>
    <title>Order API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 1200px;
        }
        button {
            margin: 10px;
            padding: 8px 12px;
            cursor: pointer;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow: auto;
            max-height: 400px;
        }
        .result {
            margin-top: 20px;
        }
        .controls {
            margin-bottom: 20px;
        }
        input {
            padding: 8px;
            width: 300px;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Order API Test</h1>
    <div class="controls">
        <div>
            <label>Admin Token:</label>
            <input type="text" id="tokenInput" placeholder="Paste your admin token here">
        </div>
        <div>
            <button onclick="testNewestOrders()">Test Newest First</button>
            <button onclick="testOldestOrders()">Test Oldest First</button>
            <button onclick="testStatusAsc()">Test Status A-Z</button>
            <button onclick="testStatusDesc()">Test Status Z-A</button>
        </div>
    </div>
    
    <div class="result">
        <h3>Result:</h3>
        <div id="status"></div>
        <pre id="output"></pre>
    </div>

    <script>
        async function makeRequest(sortBy, sortOrder) {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) {
                setStatus('Please enter an admin token', 'error');
                return;
            }
            
            setStatus('Making request...', 'pending');
            const url = `http://127.0.0.1:8001/api/admin/orders?page=1&per_page=15&status=all&search=&sort_by=${sortBy}&sort_order=${sortOrder}`;
            
            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const statusText = `Response status: ${response.status} ${response.statusText}`;
                
                if (response.ok) {
                    const data = await response.json();
                    setStatus(`${statusText} - Success!`, 'success');
                    document.getElementById('output').textContent = JSON.stringify(data, null, 2);
                } else {
                    try {
                        const errorData = await response.json();
                        setStatus(`${statusText} - API Error`, 'error');
                        document.getElementById('output').textContent = JSON.stringify(errorData, null, 2);
                    } catch (e) {
                        const text = await response.text();
                        setStatus(`${statusText} - Failed to parse response as JSON`, 'error');
                        document.getElementById('output').textContent = text;
                    }
                }
            } catch (error) {
                setStatus(`Network error: ${error.message}`, 'error');
                document.getElementById('output').textContent = error.stack;
            }
        }
        
        function setStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = type;
        }
        
        function testNewestOrders() {
            makeRequest('created_at', 'desc');
        }
        
        function testOldestOrders() {
            makeRequest('created_at', 'asc');
        }
        
        function testStatusAsc() {
            makeRequest('status', 'asc');
        }
        
        function testStatusDesc() {
            makeRequest('status', 'desc');
        }
    </script>
</body>
</html>
