<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Edit Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        #log { max-height: 400px; overflow-y: auto; padding: 10px; background-color: #f8f9fa; border: 1px solid #dee2e6; }
    </style>
</head>
<body>
    <h1>🛠️ Customer Edit Functionality Test</h1>

    <div class="test-section info">
        <h2>📋 Test Status</h2>
        <p><strong>Backend:</strong> <span id="backendStatus">⏳ Checking...</span></p>
        <p><strong>Frontend:</strong> <span id="frontendStatus">⏳ Checking...</span></p>
        <p><strong>Admin Token:</strong> <span id="tokenStatus">Not acquired</span></p>
    </div>

    <div class="test-section">
        <h2>🔧 Actions</h2>
        <button class="btn-primary" onclick="checkServers()">🔍 Check Servers</button>
        <button class="btn-primary" onclick="adminLogin()">🔑 Admin Login</button>
        <button class="btn-primary" onclick="testCustomerUpdate()">✏️ Test Customer Update</button>
        <button class="btn-success" onclick="openDashboard()">🚀 Open Dashboard</button>
    </div>

    <div class="test-section">
        <h2>📊 Test Log</h2>
        <div id="log"></div>
    </div>

    <script>
        let adminToken = '';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#007bff';
            logDiv.innerHTML += `<div style="color: ${color}; margin: 5px 0;">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function checkServers() {
            log('🔍 Checking server status...', 'info');
            
            // Check backend
            try {
                const backendResponse = await fetch('http://127.0.0.1:8001/api/test');
                if (backendResponse.ok) {
                    document.getElementById('backendStatus').innerHTML = '✅ Online';
                    log('✅ Backend server is running', 'success');
                } else {
                    document.getElementById('backendStatus').innerHTML = '❌ Error';
                    log('❌ Backend server responded with error', 'error');
                }
            } catch (error) {
                document.getElementById('backendStatus').innerHTML = '❌ Offline';
                log(`❌ Backend server error: ${error.message}`, 'error');
            }

            // Check frontend
            try {
                const frontendResponse = await fetch('http://localhost:3008');
                if (frontendResponse.ok) {
                    document.getElementById('frontendStatus').innerHTML = '✅ Online';
                    log('✅ Frontend server is running', 'success');
                } else {
                    document.getElementById('frontendStatus').innerHTML = '❌ Error';
                    log('❌ Frontend server responded with error', 'error');
                }
            } catch (error) {
                document.getElementById('frontendStatus').innerHTML = '❌ Offline';
                log(`❌ Frontend server error: ${error.message}`, 'error');
            }
        }

        async function adminLogin() {
            log('🔑 Attempting admin login...', 'info');
            try {
                const response = await fetch('http://127.0.0.1:8001/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@shop.com',
                        password: 'admin123'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    adminToken = data.token;
                    document.getElementById('tokenStatus').innerHTML = '✅ Acquired';
                    log('✅ Admin login successful!', 'success');
                    log(`👤 User: ${data.user.name} (${data.user.email})`, 'info');
                    log(`🔑 Token: ${data.token.substring(0, 20)}...`, 'info');
                } else {
                    const errorData = await response.json();
                    log(`❌ Login failed: ${errorData.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
            }
        }

        async function testCustomerUpdate() {
            if (!adminToken) {
                log('❌ Please login first to get admin token', 'error');
                return;
            }

            log('✏️ Testing customer update functionality...', 'info');

            try {
                // First, get list of customers
                log('📋 Fetching customer list...', 'info');
                const customersResponse = await fetch('http://127.0.0.1:8001/api/admin/users', {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!customersResponse.ok) {
                    throw new Error('Failed to fetch customers');
                }

                const customers = await customersResponse.json();
                log(`✅ Found ${customers.length} customers`, 'success');

                // Find a test customer (not admin)
                const testCustomer = customers.find(c => c.role.role_name !== 'admin');
                if (!testCustomer) {
                    log('❌ No test customer found', 'error');
                    return;
                }

                log(`🎯 Testing with customer: ${testCustomer.name} ${testCustomer.last_name} (ID: ${testCustomer.id})`, 'info');

                // Test the customer update
                const updateData = {
                    name: testCustomer.name,
                    last_name: testCustomer.last_name,
                    email: testCustomer.email,
                    phone: testCustomer.phone || '123-456-7890',
                    role_id: testCustomer.id_role
                };

                log('📝 Sending customer update request...', 'info');
                const updateResponse = await fetch(`http://127.0.0.1:8001/api/admin/customers/${testCustomer.id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });

                if (updateResponse.ok) {
                    const updateResult = await updateResponse.json();
                    log('🎉 Customer update successful!', 'success');
                    log(`✅ API Response: ${updateResult.message}`, 'success');
                    log('✅ Customer edit functionality is working!', 'success');
                } else {
                    const errorData = await updateResponse.json();
                    log(`❌ Update failed: ${errorData.message}`, 'error');
                }

            } catch (error) {
                log(`❌ Test error: ${error.message}`, 'error');
            }
        }

        function openDashboard() {
            window.open('http://localhost:3008/admin/dashboard', '_blank');
        }

        // Auto-run server check on load
        window.onload = function() {
            checkServers();
        };
    </script>
</body>
</html>
