<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .step { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        input, button { margin: 5px; padding: 8px; }
        button { cursor: pointer; }
        #console { height: 300px; overflow-y: auto; background: #f8f9fa; padding: 10px; border: 1px solid #ddd; margin: 20px 0; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔍 Simple Image Upload Test</h1>
    
    <div class="step">
        <h3>Step 1: Get Admin Token</h3>
        <button onclick="loginAdmin()">🔑 Login Admin</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="step">
        <h3>Step 2: Test FormData Construction</h3>
        <input type="file" id="testImages" accept="image/*" multiple>
        <button onclick="testFormData()">🧪 Test FormData</button>
        <div id="formDataResult"></div>
    </div>
    
    <div class="step">
        <h3>Step 3: Test Actual Upload</h3>
        <label>Product ID: </label>
        <input type="number" id="productId" value="1">
        <button onclick="testUpload()">🚀 Upload Images</button>
        <div id="uploadResult"></div>
    </div>
    
    <div id="console"></div>
    
    <script>
        const API_BASE = 'http://127.0.0.1:8001/api';
        let adminToken = null;
        let selectedImages = [];
        
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue';
            console.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            console.scrollTop = console.scrollHeight;
        }
        
        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${type}">${message}</div>`;
        }
        
        async function loginAdmin() {
            log('🔑 Attempting admin login...');
            showResult('loginResult', '🔄 Logging in...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@admin.com',
                        password: 'admin123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    adminToken = data.token;
                    log(`✅ Login successful! Token: ${adminToken.substring(0, 20)}...`, 'success');
                    showResult('loginResult', `✅ Admin logged in successfully!`, 'success');
                } else {
                    const error = await response.text();
                    log(`❌ Login failed: ${response.status} - ${error}`, 'error');
                    showResult('loginResult', `❌ Login failed: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`💥 Login error: ${error.message}`, 'error');
                showResult('loginResult', `❌ Error: ${error.message}`, 'error');
            }
        }
        
        function testFormData() {
            const filesInput = document.getElementById('testImages');
            
            if (!filesInput.files.length) {
                showResult('formDataResult', '❌ Please select images first', 'error');
                return;
            }
            
            selectedImages = Array.from(filesInput.files);
            log(`🧪 Testing FormData construction with ${selectedImages.length} images`);
            
            try {
                // Build FormData exactly like dashboard
                const formData = new FormData();
                formData.append('name', 'Test Product Update');
                formData.append('category_id', 1);
                formData.append('price', 99.99);
                formData.append('current_price', 79.99);
                formData.append('description', 'Test description');
                formData.append('size', 'M');
                formData.append('status', 'active');
                
                // Add images exactly like dashboard
                selectedImages.forEach((img, idx) => {
                    formData.append('images[]', img);
                    log(`📸 Added to FormData: images[${idx}] = ${img.name} (${img.size} bytes)`);
                });
                
                // Verify FormData contents
                let totalEntries = 0;
                let imageEntries = 0;
                
                for (let [key, value] of formData.entries()) {
                    totalEntries++;
                    if (key.startsWith('images')) {
                        imageEntries++;
                        log(`✅ FormData contains: ${key} = FILE(${value.name})`, 'success');
                    } else {
                        log(`📋 FormData contains: ${key} = ${value}`);
                    }
                }
                
                if (imageEntries === selectedImages.length) {
                    log(`✅ FormData construction SUCCESS! ${imageEntries} images ready`, 'success');
                    showResult('formDataResult', `✅ FormData ready! ${imageEntries} images`, 'success');
                } else {
                    log(`❌ FormData issue: Expected ${selectedImages.length}, got ${imageEntries}`, 'error');
                    showResult('formDataResult', `❌ FormData error`, 'error');
                }
                
            } catch (error) {
                log(`💥 FormData error: ${error.message}`, 'error');
                showResult('formDataResult', `❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function testUpload() {
            if (!adminToken) {
                showResult('uploadResult', '❌ Please login first', 'error');
                return;
            }
            
            const productId = document.getElementById('productId').value;
            if (!productId) {
                showResult('uploadResult', '❌ Please enter product ID', 'error');
                return;
            }
            
            if (!selectedImages.length) {
                showResult('uploadResult', '❌ Please test FormData first', 'error');
                return;
            }
            
            log(`🚀 Testing actual upload to product ${productId}`);
            showResult('uploadResult', '🔄 Uploading...', 'info');
            
            try {
                // Build FormData exactly like dashboard
                const formData = new FormData();
                formData.append('name', 'Debug Test Product Update');
                formData.append('category_id', 1);
                formData.append('price', 99.99);
                formData.append('current_price', 79.99);
                formData.append('description', 'Debug test update');
                formData.append('size', 'M');
                formData.append('status', 'active');
                
                // Add images
                selectedImages.forEach((img, idx) => {
                    formData.append('images[]', img);
                    log(`📤 Uploading: ${img.name} (${img.size} bytes)`);
                });
                
                log(`📡 Sending PUT request to: ${API_BASE}/products/${productId}`);
                log(`🔑 Using token: ${adminToken.substring(0, 20)}...`);
                
                const response = await fetch(`${API_BASE}/products/${productId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                        // No Content-Type for FormData
                    },
                    body: formData
                });
                
                log(`📥 Response: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✅ Upload SUCCESS!`, 'success');
                    log(`📊 Response: ${JSON.stringify(result, null, 2)}`, 'success');
                    
                    showResult('uploadResult', `
                        ✅ Upload successful!<br>
                        <strong>Images:</strong> ${result.images ? result.images.length : 0}<br>
                        <strong>Paths:</strong> ${JSON.stringify(result.images)}
                    `, 'success');
                } else {
                    const errorText = await response.text();
                    log(`❌ Upload failed: ${response.status} - ${errorText}`, 'error');
                    showResult('uploadResult', `❌ Upload failed: ${response.status}`, 'error');
                }
                
            } catch (error) {
                log(`💥 Upload error: ${error.message}`, 'error');
                showResult('uploadResult', `❌ Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
