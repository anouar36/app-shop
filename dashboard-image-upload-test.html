<!DOCTYPE html>
<html>
<head>
    <title>🎯 Dashboard Image Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: white; }
        .result { margin-top: 10px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        button { padding: 12px 24px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        input, select, textarea { margin: 5px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .form-group { margin: 10px 0; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        .upload-area { border: 2px dashed #007bff; padding: 20px; text-align: center; border-radius: 8px; margin: 10px 0; }
        .upload-area.dragover { background: #e3f2fd; }
        .debug-log { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
        .image-preview { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .image-preview img { width: 100px; height: 100px; object-fit: cover; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Dashboard Image Upload Test</h1>
        <p class="info">This simulates the exact dashboard image upload workflow.</p>

        <div class="section">
            <h2>🔐 Admin Login</h2>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="adminEmail" value="admin@admin.com" style="width: 200px;">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="adminPassword" value="admin123" style="width: 200px;">
            </div>
            <button class="btn-primary" onclick="loginAdmin()">🔑 Login as Admin</button>
            <div id="loginResult"></div>
        </div>

        <div class="section">
            <h2>📝 Edit Product Form (Dashboard Simulation)</h2>
            <div class="form-group">
                <label>Product ID:</label>
                <input type="number" id="productId" value="1" style="width: 100px;">
                <button class="btn-success" onclick="loadProduct()">📦 Load Product Data</button>
            </div>
            
            <div class="form-group">
                <label>Product Name:</label>
                <input type="text" id="productName" value="Test Product" style="width: 300px;">
            </div>
            
            <div class="form-group">
                <label>Category ID:</label>
                <select id="categoryId" style="width: 200px;">
                    <option value="1">Category 1</option>
                    <option value="2">Category 2</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Price:</label>
                <input type="number" id="price" value="99.99" step="0.01" style="width: 150px;">
            </div>
            
            <div class="form-group">
                <label>Sale Price:</label>
                <input type="number" id="currentPrice" value="79.99" step="0.01" style="width: 150px;">
            </div>
            
            <div class="form-group">
                <label>Description:</label>
                <textarea id="description" style="width: 300px; height: 60px;">Test product description</textarea>
            </div>
            
            <div class="form-group">
                <label>Size:</label>
                <input type="text" id="size" value="M" style="width: 100px;">
            </div>

            <div class="form-group">
                <label>Images (Multiple Upload):</label>
                <div class="upload-area" onclick="document.getElementById('imageFiles').click()">
                    📸 Click to select images or drag & drop
                    <input type="file" id="imageFiles" accept="image/*" multiple style="display: none;" onchange="handleImageSelection(this)">
                </div>
                <div id="imagePreview" class="image-preview"></div>
                <div id="imageStatus"></div>
            </div>

            <button class="btn-primary" onclick="simulateDashboardSave()">💾 Save Product (Dashboard Style)</button>
            <div id="saveResult"></div>
        </div>

        <div class="section">
            <h2>📋 Debug Information</h2>
            <button class="btn-success" onclick="clearLog()">🗑️ Clear Log</button>
            <div id="debugLog" class="debug-log"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8001/api';
        let adminToken = null;
        let selectedImages = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const debugLog = document.getElementById('debugLog');
            const color = type === 'error' ? '#f87171' : type === 'success' ? '#4ade80' : type === 'warning' ? '#fbbf24' : '#60a5fa';
            debugLog.innerHTML += `<div style="color: ${color};">[${timestamp}] [${type.toUpperCase()}] ${message}</div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(`[${timestamp}] [${type.toUpperCase()}] ${message}`);
        }

        function showResult(elementId, message, type = 'info') {
            document.getElementById(elementId).innerHTML = `<div class="${type}">${message}</div>`;
        }

        function clearLog() {
            document.getElementById('debugLog').innerHTML = '';
            log('Debug log cleared');
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            log(`🔐 Attempting admin login: ${email}`);
            showResult('loginResult', '🔄 Logging in...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    adminToken = data.access_token;
                    localStorage.setItem('admin_token', adminToken);
                    
                    log(`✅ Login successful! Token: ${adminToken.substring(0, 20)}...`, 'success');
                    showResult('loginResult', `✅ Login successful! Welcome ${data.user.name}`, 'success');
                } else {
                    const error = await response.text();
                    log(`❌ Login failed: ${response.status} - ${error}`, 'error');
                    showResult('loginResult', `❌ Login failed: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`💥 Login error: ${error.message}`, 'error');
                showResult('loginResult', `❌ Network error: ${error.message}`, 'error');
            }
        }

        async function loadProduct() {
            const productId = document.getElementById('productId').value;
            if (!productId) return;
            
            log(`📦 Loading product data for ID: ${productId}`);
            
            try {
                const response = await fetch(`${API_BASE}/products`);
                if (response.ok) {
                    const products = await response.json();
                    const product = products.find(p => p.id == productId);
                    
                    if (product) {
                        document.getElementById('productName').value = product.name || '';
                        document.getElementById('categoryId').value = product.category_id || 1;
                        document.getElementById('price').value = product.price || '';
                        document.getElementById('currentPrice').value = product.current_price || '';
                        document.getElementById('description').value = product.description || '';
                        document.getElementById('size').value = product.size || '';
                        
                        log(`✅ Product loaded: ${product.name}`, 'success');
                        log(`📊 Current images: ${product.images ? product.images.length : 0} files`);
                    } else {
                        log(`❌ Product not found: ${productId}`, 'error');
                    }
                }
            } catch (error) {
                log(`💥 Error loading product: ${error.message}`, 'error');
            }
        }

        function handleImageSelection(input) {
            selectedImages = Array.from(input.files);
            log(`📸 Images selected: ${selectedImages.length} files`);
            
            // Show preview
            const previewDiv = document.getElementById('imagePreview');
            previewDiv.innerHTML = '';
            
            selectedImages.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.title = file.name;
                    previewDiv.appendChild(img);
                };
                reader.readAsDataURL(file);
                
                log(`  Image ${index + 1}: ${file.name} (${file.size} bytes, ${file.type})`);
            });
            
            showResult('imageStatus', `✅ ${selectedImages.length} images selected`, 'success');
        }

        async function simulateDashboardSave() {
            if (!adminToken) {
                showResult('saveResult', '❌ Please login first', 'error');
                return;
            }
            
            const productId = document.getElementById('productId').value;
            if (!productId) {
                showResult('saveResult', '❌ Please enter product ID', 'error');
                return;
            }
            
            log(`💾 Starting dashboard-style save for product ${productId}`);
            showResult('saveResult', '🔄 Saving product...', 'info');
            
            try {
                // Check if there are new images to upload (dashboard logic)
                const hasNewImages = selectedImages && selectedImages.length > 0;
                
                log(`🔍 Dashboard logic check:`);
                log(`  selectedImages: ${selectedImages ? selectedImages.length : 'null'}`);
                log(`  hasNewImages: ${hasNewImages}`);
                
                if (hasNewImages) {
                    log(`📤 Using FormData approach (has images)`);
                    
                    // Use FormData for file upload (exactly like dashboard)
                    const formData = new FormData();
                    formData.append('name', document.getElementById('productName').value);
                    formData.append('category_id', parseInt(document.getElementById('categoryId').value));
                    formData.append('price', parseFloat(document.getElementById('price').value));
                    formData.append('current_price', parseFloat(document.getElementById('currentPrice').value));
                    formData.append('description', document.getElementById('description').value);
                    formData.append('size', document.getElementById('size').value || '');
                    formData.append('status', 'active');
                    
                    // Add new images (exactly like dashboard)
                    selectedImages.forEach((img, idx) => {
                        formData.append('images[]', img);
                        log(`📸 Added to FormData: images[${idx}] = ${img.name} (${img.size} bytes)`);
                    });
                    
                    log(`📋 FormData entries:`);
                    for (let [key, value] of formData.entries()) {
                        if (value instanceof File) {
                            log(`  ${key}: FILE(${value.name}, ${value.size} bytes)`);
                        } else {
                            log(`  ${key}: ${value}`);
                        }
                    }
                    
                    const response = await fetch(`${API_BASE}/products/${productId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${adminToken}`
                            // Don't set Content-Type for FormData
                        },
                        body: formData
                    });
                    
                    log(`📥 Response status: ${response.status} ${response.statusText}`);
                    
                    if (response.ok) {
                        const result = await response.json();
                        log(`✅ FormData update successful!`, 'success');
                        log(`📊 Result: ${JSON.stringify(result, null, 2)}`, 'success');
                        
                        showResult('saveResult', `
                            ✅ Product updated successfully!<br>
                            <strong>Images:</strong> ${result.images ? result.images.length : 0} files<br>
                            <strong>Paths:</strong> ${JSON.stringify(result.images)}
                        `, 'success');
                    } else {
                        const errorText = await response.text();
                        log(`❌ FormData update failed: ${response.status} - ${errorText}`, 'error');
                        showResult('saveResult', `❌ Update failed: ${response.status}<br>${errorText}`, 'error');
                    }
                    
                } else {
                    log(`📤 Using JSON approach (no images)`);
                    
                    // Use JSON for text-only updates (dashboard fallback)
                    const response = await fetch(`${API_BASE}/products/${productId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${adminToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: document.getElementById('productName').value,
                            category_id: parseInt(document.getElementById('categoryId').value),
                            price: parseFloat(document.getElementById('price').value),
                            current_price: parseFloat(document.getElementById('currentPrice').value),
                            description: document.getElementById('description').value,
                            size: document.getElementById('size').value,
                            status: 'active'
                        })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        log(`✅ JSON update successful!`, 'success');
                        showResult('saveResult', '✅ Product updated (text only)!', 'success');
                    } else {
                        const errorText = await response.text();
                        log(`❌ JSON update failed: ${response.status} - ${errorText}`, 'error');
                        showResult('saveResult', `❌ Update failed: ${response.status}`, 'error');
                    }
                }
                
            } catch (error) {
                log(`💥 Save error: ${error.message}`, 'error');
                showResult('saveResult', `❌ Save error: ${error.message}`, 'error');
            }
        }

        // Initialize
        window.onload = function() {
            log('🎯 Dashboard Image Upload Test initialized');
            
            // Check if there's already a token
            const existingToken = localStorage.getItem('admin_token');
            if (existingToken) {
                adminToken = existingToken;
                log(`🔑 Found existing token: ${existingToken.substring(0, 20)}...`);
                showResult('loginResult', '✅ Token found in localStorage', 'success');
            }
            
            // Load initial product data
            loadProduct();
        };
    </script>
</body>
</html>
